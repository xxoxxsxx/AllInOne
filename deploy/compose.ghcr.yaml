# NAS 拉取 GHCR 镜像部署（与现有 cdk-ledger-app / TickerSentry 的 compose.ghcr.yaml 惯例一致）。
# 使用：
#   cd deploy && cp .env.example .env   # 首次：填入实际值
#   docker login ghcr.io                # 用户名 xxoxxsxx，password 为 PAT(read:packages)；
#                                       # 或将 4 个包设为 Public 则无需登录
#   docker compose -f compose.ghcr.yaml pull
#   docker compose -f compose.ghcr.yaml up -d
#
# TickerSentry 数据迁移（PRD §11.1，一次性；旧容器停止后执行）：
#   mkdir -p /volume3/docker/allinone/tickersentry
#   cp -a /volume3/docker/tickersentry/ticker_data /volume3/docker/allinone/tickersentry/data
#   chown -R 65532:65532 /volume3/docker/allinone/tickersentry
# 完成后 data 目录内应直接是 ticker.db（及 WAL 文件）。
name: allinone

services:
  portal:
    image: ghcr.io/xxoxxsxx/allinone-portal:main
    pull_policy: always
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PORTAL_CONFIG_DIR: /config
      PORTAL_HEALTH_CONFIG: ${PORTAL_HEALTH_CONFIG:-/config/health.json}
    volumes:
      - ../config:/config:ro
    networks:
      - gateway
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ledger:
    image: ghcr.io/xxoxxsxx/allinone-ledger:main
    pull_policy: always
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: ${CDK_DATABASE_URL:?请在 deploy/.env 中设置 CDK_DATABASE_URL}
    networks:
      - gateway
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ledger/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  tickersentry:
    image: ghcr.io/xxoxxsxx/allinone-tickersentry:main
    pull_policy: always
    restart: unless-stopped
    init: true
    user: "65532:65532"
    read_only: true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      BASE_PATH: /stocks
      PUBLIC_ORIGIN: ${TICKER_PUBLIC_ORIGIN:-}
      PORTAL_URL: ${PORTAL_URL:-}
    volumes:
      # TICKER_DATA_DIR 指向“包含 ticker.db 的目录”（见下方迁移说明）。
      - ${TICKER_DATA_DIR:?请在 deploy/.env 中设置 TICKER_DATA_DIR}:/data
    networks:
      - gateway
    healthcheck:
      test: ["CMD", "/app", "-check", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    init: true
    ports:
      - "${ALLINONE_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ALLINONE_SITE: ${ALLINONE_SITE:-:8080}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../apps/framelab:/srv/framelab:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - portal
      - ledger
      - tickersentry
    networks:
      - gateway
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  gateway:

volumes:
  caddy_data:
  caddy_config:
