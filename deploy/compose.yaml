# AllInOne v2：单镜像单容器部署（PRD v2 §9）。
# NAS：cd deploy && docker compose pull && docker compose up -d
name: allinone

services:
  allinone:
    image: ghcr.io/xxoxxsxx/allinone:main
    pull_policy: always
    restart: unless-stopped
    init: true
    user: "1000:1000"
    ports:
      - "36889:3000"
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /data
    volumes:
      # 数据卷：台账、股票、travel 与 documents（证件库及原始附件）；备份整个目录。
      - /volume3/docker/allinone/data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
