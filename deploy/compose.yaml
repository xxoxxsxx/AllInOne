# AllInOne 部署编排（M1：门户 + 网关；M2 加入 ledger / tickersentry / framelab）
# 加固沿用现有生产 compose 已验证的模式（PRD §11.1）。
name: allinone

services:
  portal:
    build:
      context: ../apps/portal
    image: ghcr.io/xxoxxsxx/allinone-portal:local
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PORTAL_CONFIG_DIR: /config
      PORTAL_HEALTH_CONFIG: ${PORTAL_HEALTH_CONFIG:-/config/health.json}
    volumes:
      # 工具目录配置只读挂载；health.json 含内部地址，不入 Git。
      - ../config:/config:ro
    networks:
      - gateway
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    init: true
    ports:
      - "${ALLINONE_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - portal
    networks:
      - gateway
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---- M2 接入示例（届时取消注释并补齐） ----
  # ledger:
  #   image: ghcr.io/xxoxxsxx/cdk-ledger-app:main
  #   restart: unless-stopped
  #   init: true
  #   environment:
  #     TZ: ${TZ:-Asia/Shanghai}
  #     DATABASE_URL: ${CDK_DATABASE_URL:?请在 deploy/.env 中设置}
  #   networks:
  #     - gateway
  #
  # tickersentry:
  #   image: ghcr.io/xxoxxsxx/tickersentry:main
  #   restart: unless-stopped
  #   init: true
  #   user: "65532:65532"
  #   read_only: true
  #   volumes:
  #     - ${TICKER_DATA_DIR:?请在 deploy/.env 中设置}/data:/data
  #   networks:
  #     - gateway

networks:
  gateway:

volumes:
  caddy_data:
  caddy_config:
