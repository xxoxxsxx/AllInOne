name: CI

on:
  push:
    branches: [main]
    # 文档类提交不跑 CI（Release 同样过滤，main 上的代码提交仍每次完整执行）。
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**.txt"
      - "LICENSE*"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**.txt"
      - "LICENSE*"
      - ".gitignore"

concurrency:
  # 同分支连推时只保留最新一次运行；main 的发版检查每个提交都完整跑完，不取消。
  group: ci-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

jobs:
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 纯 Node 单文件校验：无第三方依赖，跳过 pnpm 安装与缓存恢复。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 校验工具目录配置
        run: node --experimental-strip-types scripts/validate-config.ts

  app-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/allinone
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/allinone/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/allinone/pnpm-lock.yaml
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 单元测试
        run: pnpm test
      - name: 类型检查与构建
        run: pnpm build
