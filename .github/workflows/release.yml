name: Release Docker images

# 推送到 main、打 v* 标签或手动触发时，构建并发布镜像到 GHCR（PRD §11.2）。
# NAS 直接拉取：docker compose pull && docker compose up -d
on:
  push:
    branches: [main]
    tags: ["v*"]
    # 文档类提交不改变镜像内容，跳过构建，省下排队与构建的约 2 分钟。
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**.txt"
      - "LICENSE*"
      - ".gitignore"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: xxoxxsxx

# main 上连推多个提交时只构建最新一个：GHCR 每个提交都有 sha- 标签，
# 被取消的中间提交不会发布镜像，latest/branch 标签始终指向最新提交。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  allinone:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/allinone
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: apps/allinone
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA 缓存上限 10GB/仓库。默认 min 只缓存最终镜像层：runner 层稳定命中；
          # mode=max 会把 node_modules(~175MB) 等中间层每轮全量上传，反而多花 80-100s。
          cache-from: type=gha
          cache-to: type=gha
