name: tickersentry

services:
  tickersentry:
    container_name: tickersentry
    image: ghcr.io/xxoxxsxx/tickersentry:main
    pull_policy: always
    user: "65532:65532"
    read_only: true
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ticker_data:/data
    healthcheck:
      test: ["CMD", "/app", "-check", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  ticker_data:
