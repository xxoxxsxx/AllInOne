services:
  tickersentry:
    build: .
    # For a NAS pulling from GHCR, use compose.ghcr.yaml.
    user: "65532:65532"
    read_only: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ticker_data:/data
    healthcheck:
      test: ["CMD", "/app", "-check", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  ticker_data:
