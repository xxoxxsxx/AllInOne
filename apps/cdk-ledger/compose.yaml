services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cdk-ledger-app:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TZ: ${TZ:-Asia/Shanghai}
      NEXT_TELEMETRY_DISABLED: ${NEXT_TELEMETRY_DISABLED:-1}
